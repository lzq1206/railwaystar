<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>China Railway Dark Sky Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="loading" class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-950/95">
      <div class="flex flex-col items-center gap-4">
        <div class="h-12 w-12 animate-spin rounded-full border-4 border-cyan-400 border-t-transparent"></div>
        <p class="text-sm tracking-widest text-cyan-300">正在加载铁路与暗夜数据…</p>
      </div>
    </div>

    <main class="relative h-screen w-screen">
      <aside class="absolute left-3 top-3 z-[500] w-[320px] max-w-[calc(100vw-24px)] rounded-xl border border-slate-700/80 bg-slate-900/85 p-4 shadow-2xl backdrop-blur">
        <h1 class="mb-1 text-lg font-semibold text-cyan-300">China Railway Dark Sky Map</h1>
        <p class="mb-3 text-xs text-slate-300">选择线路并查看暗夜车站排行</p>

        <label class="mb-1 block text-xs text-slate-400" for="line-search">搜索高铁线路</label>
        <input id="line-search" type="search" placeholder="输入线路名，如：京沪高铁" class="mb-2 w-full rounded border border-slate-700 bg-slate-800 px-3 py-2 text-sm outline-none focus:border-cyan-400" />
        <select id="line-selector" class="mb-3 w-full rounded border border-slate-700 bg-slate-800 px-3 py-2 text-sm"></select>

        <section class="mb-3 rounded border border-slate-700/80 bg-slate-800/60 p-3">
          <h2 class="mb-2 text-sm font-medium text-cyan-200">模拟车次</h2>
          <ul id="train-list" class="space-y-1 text-xs text-slate-200"></ul>
        </section>

        <section class="rounded border border-slate-700/80 bg-slate-800/60 p-3">
          <h2 class="mb-2 text-sm font-medium text-cyan-200">暗夜车站 Top 排名</h2>
          <ol id="dark-station-list" class="space-y-2 text-xs text-slate-200"></ol>
        </section>
      </aside>

      <section id="station-panel" class="absolute bottom-3 left-3 z-[500] hidden w-[320px] max-w-[calc(100vw-24px)] rounded-xl border border-slate-700/80 bg-slate-900/90 p-4 shadow-2xl backdrop-blur"></section>

      <div id="map" class="h-full w-full"></div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
