<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>China Railway Dark Sky Map | 中国高铁暗夜巡礼地图</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      .star-marker {
        animation: twinkle 1.2s infinite ease-in-out;
        color: #fef08a;
        text-shadow: 0 0 8px #fde047;
        font-size: 20px;
        line-height: 20px;
      }

      @keyframes twinkle {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.55;
        }
        50% {
          transform: scale(1.2);
          opacity: 1;
        }
      }
    </style>
  </head>

  <body class="bg-slate-950 text-slate-100">
    <div class="relative h-screen w-screen overflow-hidden">
      <div id="map"></div>

      <!-- 半透明深色侧边栏 -->
      <aside class="absolute left-4 top-4 z-[1000] w-80 rounded-2xl border border-slate-700/70 bg-slate-900/75 p-4 shadow-2xl backdrop-blur">
        <h1 class="text-lg font-semibold text-cyan-300">中国高铁暗夜巡礼地图</h1>
        <p class="mt-1 text-xs text-slate-300">沿高铁线路寻找最暗观星车站</p>

        <div class="mt-4">
          <label for="routeSelect" class="mb-1 block text-xs text-slate-400">线路选择</label>
          <select id="routeSelect" class="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-sm"></select>
        </div>

        <div class="mt-3">
          <h2 class="mb-1 text-sm font-medium text-cyan-200">模拟车次列表</h2>
          <ul id="trainList" class="space-y-1 text-xs text-slate-200"></ul>
        </div>

        <div class="mt-3">
          <h2 class="mb-1 text-sm font-medium text-cyan-200">寻暗者 Top 3</h2>
          <ol id="darkTopList" class="space-y-2 text-xs text-slate-200"></ol>
        </div>
      </aside>

      <!-- 车站详情卡片 -->
      <section id="stationCard" class="absolute bottom-4 left-4 z-[1000] hidden w-80 rounded-2xl border border-slate-700/70 bg-slate-900/80 p-4 shadow-2xl backdrop-blur"></section>
    </div>

    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <!-- 前端核心逻辑 -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
